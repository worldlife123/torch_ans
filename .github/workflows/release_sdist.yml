name: Release SDist

# This workflow publishes the sdist only. The prebuilt stable-ABI wheels of the
# same tag are built and uploaded by `release_wheels.yml` - a second workflow on
# purpose, so a broken wheel build cannot stop the sdist and vice versa (PyPI
# accepts additional files for a release, it only refuses to replace one). Do not
# add wheel uploads here: two jobs uploading the same file fail the upload.
on:
  push:
    tags:
      - 'v*.*.*'
  # `workflow_dispatch` as well as the tag, like `release_wheels.yml`: the tag run
  # of v0.4.0 failed *before* the upload (a stale file name in the check below),
  # and a re-run replays that same commit's workflow file, so the fix could not
  # reach PyPI without moving the tag. With a dispatch entry point the fixed
  # workflow can publish the same version from `main` (PyPI accepts additional
  # files for a release), and `publish=false` gives the dry run this workflow
  # never had.
  workflow_dispatch:
    inputs:
      publish:
        description: 'Upload the sdist to PyPI (unchecked: build and verify only)'
        type: boolean
        default: false

jobs:
  publish:
    name: Build and publish the sdist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine pytest

      - name: Install PyTorch (CPU)
        # The release is an sdist: users compile the extension on their own
        # machine, so the guard below builds it exactly the same way - against a
        # torch that is already installed, without build isolation.
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Build sdist
        # Isolated: this is the metadata path PyPI consumers get (PEP 621).
        run: python -m build --sdist

      - name: Check the sdist can be built from
        # ans_bindings.hpp / ans_build_config.hpp are required to compile the
        # extension and setuptools does not recompute MANIFEST.in when new
        # source files appear, so their presence is asserted explicitly. (Both
        # were named `rans_*` before tANS joined the family; this check had
        # never run, so the stale names failed the first release that reached
        # it - before the upload, which is why the sdist was not published.)
        # The listing is materialised once instead of being piped into grep:
        # `grep -q` exits at its first match, which makes tar die of SIGPIPE
        # ("tar: stdout: write error", exit 2) and `pipefail` then fails the step.
        run: |
          set -euo pipefail
          listing=$(mktemp)
          tar -tzf dist/torch_ans-*.tar.gz > "$listing"
          grep -q 'torch_ans/ans_bindings.hpp' "$listing"
          grep -q 'torch_ans/ans_build_config.hpp' "$listing"
          ! grep -q '\.so$' "$listing"

      - name: Install from the sdist (compiles the extension)
        run: pip install --no-build-isolation dist/torch_ans-*.tar.gz

      - name: Run tests against the installed package
        # Run outside the checkout, otherwise `./torch_ans` (which has no compiled
        # extension) shadows the installed package and the tests would exercise
        # the runtime-compile path instead of the built artifact.
        run: |
          cd "$(mktemp -d)"
          python -m pytest -q "$GITHUB_WORKSPACE/tests"

      - name: Twine check
        run: python -m twine check dist/*

      - name: Publish to PyPI
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          # Upload artifacts (sdist). Use TestPyPI by changing the repository url if desired.
          python -m twine upload --non-interactive dist/*

      - name: "Dry run: upload skipped"
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        run: |
          echo "publish=false: keeping this sdist (upload with the same dispatch"
          echo "and publish=true):"
          ls -l dist
