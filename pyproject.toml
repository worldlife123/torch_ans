[build-system]
requires = ["setuptools<60", "wheel", "pybind11"]
build-backend = "setuptools.build_meta"

[project]
name = "torch_ans"
version = "0.2.1.post1"
description = "PyTorch extension for ANS-based compression (C++/CUDA)"
authors = [
    { name="worldlife", email="worldlife@sjtu.edu.cn" }
]
requires-python = ">=3.7"
dependencies = [
    "torch>=1.10",
    "pybind11",
    "ninja"
]
readme = { file = "README.md", content-type = "text/markdown" }
license = { file="LICENSE" }

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "gcovr"]

[tool.setuptools.packages.find]
exclude = ["tests"]

[tool.pytest.ini_options]
# addopts = "--cov=torch_ans --cov-report=html --cov-report=term-missing"
testpaths = ["tests"]
